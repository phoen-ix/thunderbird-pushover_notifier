name: CI

# Unit tests, web-ext lint and build, plus the end-to-end test (real
# Thunderbird builds in Docker, one job per build) on every push to main and
# every PR.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build

  e2e:
    name: e2e (Thunderbird ${{ matrix.tb }} ${{ matrix.lang }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # The default builds of tests/e2e/run.sh, one job each.
      matrix:
        include:
          - { tb: 140.17.0esr, lang: en-US }
          - { tb: latest, lang: en-US }
          - { tb: latest, lang: de }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The test installs the last 1.x release (commit afb8089) first.
          fetch-depth: 0

      # One retry, as a warning: a build takes minutes, and a flaky run should
      # show up without blocking. The second run has its own log and screenshots.
      - name: End-to-end test
        env:
          TB_BUILDS: ${{ matrix.tb }}:${{ matrix.lang }}
        run: |
          ARTIFACTS="$RUNNER_TEMP/e2e/run-1" scripts/e2e.sh || {
            echo "::warning::The end-to-end test failed once ($TB_BUILDS); retrying."
            ARTIFACTS="$RUNNER_TEMP/e2e/run-2" scripts/e2e.sh
          }

      # Log and settings-page screenshots (a render check; the screenshots to
      # commit come from docs-screenshots.yml).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-${{ matrix.tb }}-${{ matrix.lang }}
          path: ${{ runner.temp }}/e2e/
          retention-days: 7
